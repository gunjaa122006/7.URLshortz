<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URLshortz - Professional URL Shortening Service</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #3b82f6;
            --success: #10b981;
            --error: #ef4444;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #475569;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        .header {
            padding: 2rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg-card);
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--primary-light);
            letter-spacing: -0.5px;
        }

        .tagline {
            margin-top: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px var(--shadow);
            max-width: 680px;
            width: 100%;
            padding: 2.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            background: #3d4b5f;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        .btn-primary {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-card {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #1a2332;
            border: 1px solid var(--border);
            border-radius: 12px;
            display: none;
        }

        .result-card.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            color: var(--success);
            font-weight: 600;
        }

        .result-url-group {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .result-url-input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: var(--primary-light);
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
        }

        .btn-copy {
            padding: 0.75rem 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: var(--primary-dark);
        }

        .btn-copy.copied {
            background: var(--success);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
        }

        .stat-box {
            padding: 1rem;
            background: var(--bg-input);
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .alert {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error);
            color: #fca5a5;
        }

        .features-section {
            margin-top: 2.5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        .features-title {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
        }

        .feature-item {
            padding: 1rem;
            background: #1a2332;
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
            transition: all 0.2s;
        }

        .feature-item:hover {
            background: #212d3f;
            border-color: var(--primary);
        }

        .feature-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .feature-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .footer {
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 640px) {
            .card {
                padding: 1.5rem;
            }

            .result-url-group {
                flex-direction: column;
            }

            .btn-copy {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">URLshortz</div>
        <div class="tagline">Professional URL Shortening Service</div>
    </header>

    <main class="main-container">
        <div class="card">
            <form id="shortenForm">
                <div class="form-group">
                    <label for="urlInput">Enter URL</label>
                    <input 
                        type="text" 
                        id="urlInput" 
                        placeholder="https://example.com/your-long-url-here"
                        autocomplete="url"
                        required
                    >
                </div>

                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="btnText">Generate Short URL</span>
                    <span id="btnLoading" style="display: none;" class="spinner"></span>
                </button>
            </form>

            <div id="errorMessage" class="alert alert-error"></div>

            <div id="result" class="result-card">
                <div class="result-header">
                    <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                    Short URL Created Successfully
                </div>
                
                <div class="result-url-group">
                    <input type="text" id="shortUrlInput" class="result-url-input" readonly>
                    <button class="btn-copy" id="copyBtn">Copy Link</button>
                </div>

                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-label">Short Code</div>
                        <div class="stat-value" id="shortCode">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Clicks</div>
                        <div class="stat-value" id="clicks">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Created</div>
                        <div class="stat-value" id="created">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Type</div>
                        <div class="stat-value" id="redirectType">301</div>
                    </div>
                </div>
            </div>

            <div class="features-section">
                <div class="features-title">Features</div>
                <div class="features-grid">
                    <div class="feature-item">
                        <div class="feature-title">Fast</div>
                        <div class="feature-desc">Instant generation</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-title">Secure</div>
                        <div class="feature-desc">URL validation</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-title">Analytics</div>
                        <div class="feature-desc">Click tracking</div>
                    </div>
                    <div class="feature-item">
                        <div class="feature-title">Permanent</div>
                        <div class="feature-desc">Never expires</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        Powered by URLshortz - Open Source URL Shortening
    </footer>

    <script>
        const form = document.getElementById('shortenForm');
        const urlInput = document.getElementById('urlInput');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnLoading = document.getElementById('btnLoading');
        const result = document.getElementById('result');
        const errorMessage = document.getElementById('errorMessage');
        const shortUrlInput = document.getElementById('shortUrlInput');
        const copyBtn = document.getElementById('copyBtn');

        const API_BASE = window.location.origin;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = urlInput.value.trim();
            
            result.classList.remove('show');
            errorMessage.classList.remove('show');
            
            submitBtn.disabled = true;
            btnText.style.display = 'none';
            btnLoading.style.display = 'block';

            try {
                const response = await fetch(`${API_BASE}/api/shorten`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Failed to shorten URL');
                }

                displayResult(data.data);

            } catch (error) {
                showError(error.message);
            } finally {
                submitBtn.disabled = false;
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
            }
        });

        function displayResult(data) {
            shortUrlInput.value = data.shortUrl;
            document.getElementById('shortCode').textContent = data.shortCode;
            document.getElementById('clicks').textContent = data.clickCount || 0;
            document.getElementById('created').textContent = new Date(data.createdAt).toLocaleDateString();
            document.getElementById('redirectType').textContent = data.redirectType;
            
            result.classList.add('show');
            shortUrlInput.select();
        }

        function showError(message) {
            errorMessage.textContent = `Error: ${message}`;
            errorMessage.classList.add('show');
        }

        copyBtn.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(shortUrlInput.value);
                
                const originalText = copyBtn.textContent;
                copyBtn.textContent = 'Copied!';
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.textContent = originalText;
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (error) {
                alert('Failed to copy to clipboard');
            }
        });

        window.addEventListener('load', () => urlInput.focus());
    </script>
</body>
</html>
